<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HawkerFlow - Order Ahead</title>
<style>
  :root {
    --accent:#ff5a2e; --accent-ink:#ffffff; --accent-tint:#fff0ea; --accent-dark:#d6431a;
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7;
    --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#98989d;
    --hairline:rgba(0,0,0,.08); --danger:#ff3b30; --success:#26a65b; --warning:#b5820a;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px; --radius-pill:999px;
    --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink); }
  header {
    position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center;
    padding:13px 20px; background:rgba(245,245,247,.78); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--hairline);
  }
  .brand { display:flex; align-items:center; gap:9px; font-weight:600; font-size:1.02rem; letter-spacing:-.01em; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  #who { color:var(--ink-2); font-size:.82rem; font-weight:500; }
  main { max-width:640px; margin:0 auto; padding:20px 16px 64px; }

  .card { background:var(--surface); border-radius:var(--radius-lg); padding:20px; margin:14px 0; box-shadow:var(--shadow-card); }
  .card h2 { margin:0; font-size:1.02rem; font-weight:600; letter-spacing:-.01em; }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .muted { color:var(--ink-2); font-size:.85rem; }
  .tiny { color:var(--ink-3); font-size:.78rem; }
  .hidden { display:none !important; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:13px 0; border-bottom:.5px solid var(--hairline); }
  li:last-child { border-bottom:0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }

  button { font-family:inherit; border:0; cursor:pointer; font-size:.92rem; font-weight:600;
    transition:transform .12s ease, opacity .15s ease, background .15s ease; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; transform:none; }
  .btn-primary { background:var(--accent); color:var(--accent-ink); border-radius:var(--radius-pill);
    padding:11px 20px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .btn-primary:hover:not(:disabled) { background:var(--accent-dark); }
  .btn-block { width:100%; padding:13px; font-size:.96rem; }
  .btn-ghost { background:var(--surface-2); color:var(--ink); border-radius:var(--radius-pill); padding:8px 14px; font-size:.85rem; }
  .btn-ghost:hover { background:#eceeef; }
  .btn-text { background:transparent; color:var(--accent); padding:6px 4px; font-size:.9rem; }

  input {
    width:100%; padding:11px 13px; margin:5px 0 12px; font-size:.95rem; font-family:inherit;
    background:var(--surface-2); border:1px solid transparent; border-radius:var(--radius-md); color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus { outline:none; border-color:var(--accent); background:var(--surface); }
  input::placeholder { color:var(--ink-3); }

  .badge { padding:3px 11px; border-radius:var(--radius-pill); font-size:.72rem; font-weight:700;
    letter-spacing:.02em; text-transform:uppercase; background:var(--accent-tint); color:var(--accent-dark); }
  .badge.st-ACCEPTED, .badge.st-PREPARING { background:#fff6df; color:var(--warning); }
  .badge.st-READY { background:#e6f7ec; color:var(--success); }
  .badge.st-COLLECTED { background:#eceeef; color:var(--ink-2); }
  .badge.st-CANCELLED, .badge.st-REJECTED { background:#ffefed; color:var(--danger); }

  .stepper { display:flex; align-items:center; gap:2px; background:var(--surface-2); border-radius:var(--radius-pill); padding:3px; }
  .stepper button { width:28px; height:28px; border-radius:50%; background:var(--surface); color:var(--accent);
    font-size:1.05rem; line-height:1; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .stepper button:disabled { opacity:.3; box-shadow:none; }
  .stepper strong { min-width:22px; text-align:center; font-size:.92rem; font-variant-numeric:tabular-nums; }

  .paymethod { display:flex; justify-content:space-between; align-items:center; padding:13px 14px;
    border-radius:var(--radius-md); margin-bottom:8px; cursor:pointer; background:var(--surface-2);
    border:1.5px solid transparent; transition:background .15s ease, border-color .15s ease; }
  .paymethod.selected { border-color:var(--accent); background:var(--accent-tint); }
  .paymethod .pm-label { display:flex; align-items:center; gap:11px; font-size:.92rem; font-weight:500; }
  .paymethod .pm-icon { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); font-size:.95rem; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .paymethod input { display:none; }
  .pm-check { width:20px; height:20px; border-radius:50%; border:1.5px solid #d2d2d7; flex:none; position:relative; }
  .paymethod.selected .pm-check { border-color:var(--accent); background:var(--accent); }
  .paymethod.selected .pm-check::after {
    content:""; position:absolute; inset:0; margin:auto; width:6px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg);
  }

  .spinner { width:15px; height:15px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff;
    border-radius:50%; display:inline-block; vertical-align:-3px; margin-right:7px; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .pay-success { text-align:center; padding:18px 0 6px; }
  .pay-success .check { width:56px; height:56px; border-radius:50%; background:var(--success); color:#fff;
    font-size:1.6rem; line-height:56px; display:inline-block; margin-bottom:14px; box-shadow:0 8px 20px rgba(38,166,91,.35); }
  .pay-success p.title { margin:0; font-weight:600; font-size:1.05rem; }
  .pay-success p.sub { margin:4px 0 0; }

  #loginError:empty, #payMsg:empty { display:none; }
  #loginError { color:var(--danger); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>HawkerFlow</div>
  <div id="who" class="muted"></div>
</header>
<main>
  <!-- Fill these three values from `sam deploy` outputs (see README) -->
  <script>
    const CONFIG = {
      API_URL: "REPLACE_WITH_ApiUrl",
      CLIENT_ID: "REPLACE_WITH_UserPoolClientId",
      REGION: "ap-southeast-1",
      CENTRE_ID: "maxwell",
    };
  </script>

  <section id="login" class="card">
    <h2 style="margin-bottom:2px">Sign in</h2>
    <p class="muted" style="margin:2px 0 16px">Demo accounts are created by <code>scripts/seed_data.py</code>.</p>
    <input id="email" type="email" placeholder="Email" value="diner@hawkerflow.demo">
    <input id="password" type="password" placeholder="Password" value="HawkerDemo1!">
    <button class="btn-primary btn-block" onclick="login()">Sign in</button>
    <p id="loginError" class="tiny" style="margin-top:10px"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="card-head"><h2>Stalls</h2><span class="muted" id="centreLabel"></span></div>
      <ul id="stalls"></ul>
    </div>
    <div class="card hidden" id="menuCard">
      <div class="card-head"><h2 id="stallName"></h2><button class="btn-ghost" onclick="closeMenu()">‹ Back</button></div>
      <ul id="menu"></ul>
      <div class="row" style="margin-top:6px">
        <strong id="cartTotal" style="font-size:1.02rem">Total: $0.00</strong>
        <button class="btn-primary" id="checkoutBtn" onclick="openCheckout()">Checkout</button>
      </div>
    </div>

    <div class="card hidden" id="payCard">
      <div class="card-head"><h2>Payment</h2><button class="btn-ghost" id="payBack" onclick="closeCheckout()">‹ Back</button></div>
      <ul id="payItems" style="margin:8px 0 4px"></ul>
      <div class="row" style="margin:8px 0 18px; padding-top:12px; border-top:.5px solid var(--hairline)">
        <strong>Total</strong><strong id="payTotal" style="font-size:1.05rem"></strong>
      </div>

      <div id="payMethods">
        <label class="paymethod selected">
          <span class="pm-label"><span class="pm-icon">💳</span>Card •••• 4242</span>
          <input type="radio" name="paymethod" value="Card" checked onchange="selectPaymethod(this)"><span class="pm-check"></span>
        </label>
        <label class="paymethod">
          <span class="pm-label"><span class="pm-icon">📱</span>PayNow QR</span>
          <input type="radio" name="paymethod" value="PayNow" onchange="selectPaymethod(this)"><span class="pm-check"></span>
        </label>
        <label class="paymethod">
          <span class="pm-label"><span class="pm-icon">💵</span>Cash on collection</span>
          <input type="radio" name="paymethod" value="Cash" onchange="selectPaymethod(this)"><span class="pm-check"></span>
        </label>
      </div>

      <button class="btn-primary btn-block" id="payBtn" onclick="confirmPayment()" style="margin-top:8px">Pay <span id="payBtnAmount"></span></button>
      <p id="payMsg" class="muted" style="margin:10px 2px 0"></p>

      <div class="pay-success hidden" id="paySuccess">
        <span class="check">✓</span>
        <p class="title">Payment successful</p>
        <p class="muted sub" id="paySuccessSub"></p>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:6px">My orders</h2>
      <ul id="orders"><li class="muted">Nothing yet.</li></ul>
    </div>
    <div class="card">
      <h2 style="margin-bottom:6px">Notifications</h2>
      <ul id="notifs"><li class="muted">Nothing yet.</li></ul>
    </div>
  </section>
</main>
<script>
let token = sessionStorage.getItem("idToken") || null;
let cart = {}, currentStall = null, idemKey = null, menuById = {};

// local demo launcher (/demo/) passes ?token=local-customerN to skip the login form
{
  const demoToken = new URLSearchParams(location.search).get("token");
  if (demoToken) { token = demoToken; sessionStorage.setItem("idToken", token); }
}
const $ = (id) => document.getElementById(id);
const money = (c) => "$" + (c / 100).toFixed(2);

function emailFromToken(t) {
  try { return JSON.parse(atob(t.split(".")[1])).email || ""; } catch { return "local demo"; }
}

async function login() {
  if (CONFIG.CLIENT_ID === "LOCAL") {           // local dev server - no Cognito
    token = "local-diner"; sessionStorage.setItem("idToken", token); boot(); return;
  }
  const res = await fetch(`https://cognito-idp.${CONFIG.REGION}.amazonaws.com/`, {
    method: "POST",
    headers: { "content-type": "application/x-amz-json-1.1", "x-amz-target": "AWSCognitoIdentityProviderService.InitiateAuth" },
    body: JSON.stringify({ AuthFlow: "USER_PASSWORD_AUTH", ClientId: CONFIG.CLIENT_ID,
      AuthParameters: { USERNAME: $("email").value, PASSWORD: $("password").value } }),
  });
  const data = await res.json();
  if (!res.ok || !data.AuthenticationResult) { $("loginError").textContent = data.message || "sign-in failed"; return; }
  token = data.AuthenticationResult.IdToken;
  sessionStorage.setItem("idToken", token);
  boot();
}

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json", ...(opts.headers || {}) };
  if (token) headers.authorization = token;
  const res = await fetch(CONFIG.API_URL + path, { ...opts, headers });
  if (res.status === 401) { sessionStorage.removeItem("idToken"); location.reload(); }
  return { status: res.status, body: await res.json().catch(() => ({})) };
}

async function boot() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = emailFromToken(token);
  $("centreLabel").textContent = CONFIG.CENTRE_ID;
  const { body } = await api(`/v1/centres/${CONFIG.CENTRE_ID}/stalls`);
  $("stalls").innerHTML = (body.stalls || []).map((s) =>
    `<li class="row"><span>${s.name}<br><span class="muted">${s.description || ""}</span></span>
     <button class="${s.status === "OPEN" ? "btn-primary" : "btn-ghost"}" ${s.status !== "OPEN" ? "disabled" : ""} onclick="openMenu('${s.stallId}','${s.name.replace(/'/g, "")}')">
     ${s.status === "OPEN" ? "Order" : "Closed"}</button></li>`).join("") || '<li class="muted">No stalls yet - run the seed script.</li>';
  refreshLoops();
}

async function openMenu(stallId, name) {
  currentStall = stallId; cart = {}; idemKey = crypto.randomUUID(); menuById = {};
  $("stallName").textContent = name; $("menuCard").classList.remove("hidden");
  const { body } = await api(`/v1/stalls/${stallId}/menu`);
  (body.items || []).forEach((i) => (menuById[i.itemId] = i));
  renderMenu();
}

function renderMenu() {
  $("menu").innerHTML = Object.values(menuById).map((i) =>
    `<li class="row"><span>${i.name}<br><span class="muted">${money(i.priceCents)}${i.available ? "" : " · sold out"}</span></span>
     <span class="stepper"><button onclick="bump('${i.itemId}',-1)" ${cart[i.itemId] ? "" : "disabled"}>–</button>
     <strong>${cart[i.itemId] || 0}</strong>
     <button ${i.available ? "" : "disabled"} onclick="bump('${i.itemId}',1)">+</button></span></li>`).join("");
  const total = Object.entries(cart).reduce((sum, [id, q]) => sum + menuById[id].priceCents * q, 0);
  $("cartTotal").textContent = "Total: " + money(total);
}

function bump(itemId, delta) {
  cart[itemId] = Math.max(0, Math.min(20, (cart[itemId] || 0) + delta));
  if (!cart[itemId]) delete cart[itemId];
  renderMenu();
}

function closeMenu() { $("menuCard").classList.add("hidden"); currentStall = null; }

let paymethod = "Card";
function selectPaymethod(input) {
  paymethod = input.value;
  document.querySelectorAll(".paymethod").forEach((el) => el.classList.toggle("selected", el.contains(input)));
}

function cartLines() {
  return Object.entries(cart).map(([itemId, qty]) => ({ itemId, qty, item: menuById[itemId] }));
}
function cartTotalCents() {
  return cartLines().reduce((sum, l) => sum + l.item.priceCents * l.qty, 0);
}

function openCheckout() {
  if (!Object.keys(cart).length) return;
  const total = cartTotalCents();
  $("payItems").innerHTML = cartLines().map((l) =>
    `<li class="row"><span>${l.qty}x ${l.item.name}</span><span>${money(l.item.priceCents * l.qty)}</span></li>`).join("");
  $("payTotal").textContent = money(total);
  $("payMsg").textContent = "";
  $("payBtn").disabled = false;
  $("payBtn").innerHTML = `Pay <span id="payBtnAmount">${money(total)}</span>`;
  $("paySuccess").classList.add("hidden");
  $("payMethods").classList.remove("hidden");
  $("payBtn").classList.remove("hidden");
  $("payBack").classList.remove("hidden");
  $("menuCard").classList.add("hidden");
  $("payCard").classList.remove("hidden");
}

function closeCheckout() {
  $("payCard").classList.add("hidden");
  $("menuCard").classList.remove("hidden");
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function confirmPayment() {
  const items = Object.entries(cart).map(([itemId, qty]) => ({ itemId, qty }));
  if (!items.length) return;

  $("payBtn").disabled = true;
  $("payBtn").innerHTML = `<span class="spinner"></span>Processing payment...`;
  $("payMsg").textContent = `Charging ${paymethod}...`;
  await sleep(900);   // simulated processing delay - no real payment gateway

  const { status, body } = await api("/v1/orders", {
    method: "POST",
    headers: { "idempotency-key": idemKey },  // safe to retry: same key = same order
    body: JSON.stringify({ stallId: currentStall, items, paymentMethod: paymethod }),
  });

  if (status === 201 || status === 200) {
    $("payMethods").classList.add("hidden");
    $("payBtn").classList.add("hidden");
    $("payBack").classList.add("hidden");
    $("paySuccessSub").textContent = `${money(body.totalCents)} via ${paymethod} (simulated).`;
    $("paySuccess").classList.remove("hidden");
    cart = {}; idemKey = crypto.randomUUID(); renderMenu(); loadOrders();
    await sleep(1400);
    closeCheckout();
  } else {
    $("payBtn").disabled = false;
    $("payBtn").innerHTML = `Pay <span id="payBtnAmount">${money(cartTotalCents())}</span>`;
    $("payMsg").textContent = body.error || "Payment failed - try again.";
  }
}

async function loadOrders() {
  const { body } = await api("/v1/me/orders");
  $("orders").innerHTML = (body.orders || []).map((o) =>
    `<li class="row"><span>${o.stallName}<br><span class="muted">${o.lines.map((l) => l.qty + "x " + l.name).join(", ")} · ${money(o.totalCents)}</span></span>
     <span class="row" style="gap:8px"><span class="badge st-${o.status}">${o.status}</span>
     ${["PLACED", "ACCEPTED"].includes(o.status) ? `<button class="btn-text" onclick="cancelOrder('${o.orderId}')">Cancel</button>` : ""}</span></li>`).join("") || '<li class="muted">Nothing yet.</li>';
}

async function cancelOrder(orderId) {
  await api(`/v1/orders/${orderId}`, { method: "PATCH", body: JSON.stringify({ action: "cancel" }) });
  loadOrders();
}

async function loadNotifs() {
  const { body } = await api("/v1/me/notifications");
  $("notifs").innerHTML = (body.notifications || []).map((n) =>
    `<li>${n.message}<br><span class="muted">${n.at}</span></li>`).join("") || '<li class="muted">Nothing yet.</li>';
}

function refreshLoops() {
  loadOrders(); loadNotifs();
  setInterval(loadOrders, 5000);   // AD-08: polling in this phase
  setInterval(loadNotifs, 7000);
}

if (token) boot();
</script>
</body>
</html>
