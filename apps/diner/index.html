<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HawkerFlow - Order Ahead</title>
<style>
  :root { --brand:#b3421f; --bg:#faf7f2; --card:#fff; --ink:#2a2622; --muted:#7a7268; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.15rem; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:12px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:.95rem; }
  button.ghost { background:#eee4dc; color:var(--brand); }
  button:disabled { opacity:.5; cursor:default; }
  input { padding:8px 10px; border:1px solid #d8d0c6; border-radius:8px; width:100%; margin:4px 0 10px; font-size:1rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .muted { color:var(--muted); font-size:.85rem; }
  .badge { padding:2px 10px; border-radius:999px; font-size:.75rem; background:#efe7de; color:var(--brand); font-weight:600; }
  .hidden { display:none; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:10px 0; border-bottom:1px solid #f0e9e1; }
</style>
</head>
<body>
<header><h1>HawkerFlow</h1><div id="who" class="muted" style="color:#ffd9c9"></div></header>
<main>
  <!-- Fill these three values from `sam deploy` outputs (see README) -->
  <script>
    const CONFIG = {
      API_URL: "https://a4xonfevzl.execute-api.ap-southeast-1.amazonaws.com/prod",
      CLIENT_ID: "5nsdo9gvep5eh50iamgcc1rlh6",
      REGION: "ap-southeast-1",
      CENTRE_ID: "maxwell",
    };
  </script>

  <section id="login" class="card">
    <h2>Sign in</h2>
    <p class="muted">Demo accounts are created by <code>scripts/seed_data.py</code>.</p>
    <input id="email" type="email" placeholder="email" value="diner@hawkerflow.demo">
    <input id="password" type="password" placeholder="password" value="HawkerDemo1!">
    <button onclick="login()">Sign in</button>
    <p id="loginError" class="muted"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row"><h2 style="margin:0">Stalls</h2><span class="muted" id="centreLabel"></span></div>
      <ul id="stalls"></ul>
    </div>
    <div class="card hidden" id="menuCard">
      <div class="row"><h2 style="margin:0" id="stallName"></h2><button class="ghost" onclick="closeMenu()">Back</button></div>
      <ul id="menu"></ul>
      <div class="row"><strong id="cartTotal">Total: $0.00</strong><button id="placeBtn" onclick="placeOrder()">Place order</button></div>
      <p id="orderMsg" class="muted"></p>
    </div>
    <div class="card">
      <h2>My orders</h2>
      <ul id="orders"><li class="muted">Nothing yet.</li></ul>
    </div>
    <div class="card">
      <h2>Notifications</h2>
      <ul id="notifs"><li class="muted">Nothing yet.</li></ul>
    </div>
  </section>
</main>
<script>
let token = sessionStorage.getItem("idToken") || null;
let cart = {}, currentStall = null, idemKey = null, menuById = {};
const $ = (id) => document.getElementById(id);
const money = (c) => "$" + (c / 100).toFixed(2);

async function login() {
  const res = await fetch(`https://cognito-idp.${CONFIG.REGION}.amazonaws.com/`, {
    method: "POST",
    headers: { "content-type": "application/x-amz-json-1.1", "x-amz-target": "AWSCognitoIdentityProviderService.InitiateAuth" },
    body: JSON.stringify({ AuthFlow: "USER_PASSWORD_AUTH", ClientId: CONFIG.CLIENT_ID,
      AuthParameters: { USERNAME: $("email").value, PASSWORD: $("password").value } }),
  });
  const data = await res.json();
  if (!res.ok || !data.AuthenticationResult) { $("loginError").textContent = data.message || "sign-in failed"; return; }
  token = data.AuthenticationResult.IdToken;
  sessionStorage.setItem("idToken", token);
  boot();
}

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json", ...(opts.headers || {}) };
  if (token) headers.authorization = token;
  const res = await fetch(CONFIG.API_URL + path, { ...opts, headers });
  if (res.status === 401) { sessionStorage.removeItem("idToken"); location.reload(); }
  return { status: res.status, body: await res.json().catch(() => ({})) };
}

async function boot() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = JSON.parse(atob(token.split(".")[1])).email || "";
  $("centreLabel").textContent = CONFIG.CENTRE_ID;
  const { body } = await api(`/v1/centres/${CONFIG.CENTRE_ID}/stalls`);
  $("stalls").innerHTML = (body.stalls || []).map((s) =>
    `<li class="row"><span>${s.name}<br><span class="muted">${s.description || ""}</span></span>
     <button class="ghost" ${s.status !== "OPEN" ? "disabled" : ""} onclick="openMenu('${s.stallId}','${s.name.replace(/'/g, "")}')">
     ${s.status === "OPEN" ? "Order" : "Closed"}</button></li>`).join("") || '<li class="muted">No stalls yet - run the seed script.</li>';
  refreshLoops();
}

async function openMenu(stallId, name) {
  currentStall = stallId; cart = {}; idemKey = crypto.randomUUID(); menuById = {};
  $("stallName").textContent = name; $("menuCard").classList.remove("hidden"); $("orderMsg").textContent = "";
  const { body } = await api(`/v1/stalls/${stallId}/menu`);
  (body.items || []).forEach((i) => (menuById[i.itemId] = i));
  renderMenu();
}

function renderMenu() {
  $("menu").innerHTML = Object.values(menuById).map((i) =>
    `<li class="row"><span>${i.name} <span class="muted">${money(i.priceCents)}${i.available ? "" : " - sold out"}</span></span>
     <span><button class="ghost" onclick="bump('${i.itemId}',-1)">-</button>
     <strong style="padding:0 8px">${cart[i.itemId] || 0}</strong>
     <button class="ghost" ${i.available ? "" : "disabled"} onclick="bump('${i.itemId}',1)">+</button></span></li>`).join("");
  const total = Object.entries(cart).reduce((sum, [id, q]) => sum + menuById[id].priceCents * q, 0);
  $("cartTotal").textContent = "Total: " + money(total);
}

function bump(itemId, delta) {
  cart[itemId] = Math.max(0, Math.min(20, (cart[itemId] || 0) + delta));
  if (!cart[itemId]) delete cart[itemId];
  renderMenu();
}

function closeMenu() { $("menuCard").classList.add("hidden"); currentStall = null; }

async function placeOrder() {
  const items = Object.entries(cart).map(([itemId, qty]) => ({ itemId, qty }));
  if (!items.length) { $("orderMsg").textContent = "Cart is empty."; return; }
  $("placeBtn").disabled = true;
  const { status, body } = await api("/v1/orders", {
    method: "POST",
    headers: { "idempotency-key": idemKey },  // safe to retry: same key = same order
    body: JSON.stringify({ stallId: currentStall, items }),
  });
  $("placeBtn").disabled = false;
  if (status === 201) { $("orderMsg").textContent = `Order placed - ${money(body.totalCents)} (simulated payment).`; cart = {}; idemKey = crypto.randomUUID(); renderMenu(); loadOrders(); }
  else if (status === 200 || status === 202) { $("orderMsg").textContent = "Order accepted and is being processed."; cart = {}; idemKey = crypto.randomUUID(); renderMenu(); loadOrders(); }
  else $("orderMsg").textContent = body.error || "Could not place order.";
}

async function loadOrders() {
  const { body } = await api("/v1/me/orders");
  $("orders").innerHTML = (body.orders || []).map((o) =>
    `<li class="row"><span>${o.stallName}<br><span class="muted">${o.lines.map((l) => l.qty + "x " + l.name).join(", ")} - ${money(o.totalCents)}</span></span>
     <span><span class="badge">${o.status}</span>
     ${["PLACED", "ACCEPTED"].includes(o.status) ? `<button class="ghost" onclick="cancelOrder('${o.orderId}')">Cancel</button>` : ""}</span></li>`).join("") || '<li class="muted">Nothing yet.</li>';
}

async function cancelOrder(orderId) {
  await api(`/v1/orders/${orderId}`, { method: "PATCH", body: JSON.stringify({ action: "cancel" }) });
  loadOrders();
}

async function loadNotifs() {
  const { body } = await api("/v1/me/notifications");
  $("notifs").innerHTML = (body.notifications || []).map((n) =>
    `<li>${n.message}<br><span class="muted">${n.at}</span></li>`).join("") || '<li class="muted">Nothing yet.</li>';
}

function refreshLoops() {
  loadOrders(); loadNotifs();
  setInterval(loadOrders, 5000);   // AD-08: polling in this phase
  setInterval(loadNotifs, 7000);
}

if (token) boot();
</script>
</body>
</html>
