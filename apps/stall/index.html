<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HawkerFlow - Stall Portal</title>
<style>
  :root { --brand:#0f6e56; --bg:#f4f8f6; --card:#fff; --ink:#22302b; --muted:#6d7a74; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.15rem; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:12px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button.ghost { background:#e2ede8; color:var(--brand); }
  input, select { padding:8px 10px; border:1px solid #ccd8d2; border-radius:8px; margin:4px 4px 10px 0; font-size:.95rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:.85rem; }
  .badge { padding:2px 10px; border-radius:999px; font-size:.75rem; background:#e2ede8; color:var(--brand); font-weight:600; }
  .hidden { display:none; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:10px 0; border-bottom:1px solid #edf2ef; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid #edf2ef; }
</style>
</head>
<body>
<header><h1>HawkerFlow - Stall Portal</h1><div id="who" class="muted" style="color:#cdeade"></div></header>
<main>
  <script>
    const CONFIG = {
      API_URL: "https://a4xonfevzl.execute-api.ap-southeast-1.amazonaws.com/prod",
      CLIENT_ID: "5nsdo9gvep5eh50iamgcc1rlh6",
      REGION: "ap-southeast-1",
    };
  </script>

  <section id="login" class="card">
    <h2>Owner sign in</h2>
    <input id="email" type="email" placeholder="email" value="owner@hawkerflow.demo">
    <input id="password" type="password" placeholder="password" value="HawkerDemo1!">
    <button onclick="login()">Sign in</button>
    <p id="loginError" class="muted"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row"><h2 style="margin:0">My stalls</h2><select id="stallSelect" onchange="selectStall()"></select></div>
      <details><summary class="muted">Register a new stall</summary>
        <input id="newName" placeholder="stall name"><input id="newCentre" placeholder="centre id (e.g. maxwell)">
        <button onclick="createStall()">Create</button>
      </details>
      <p><button class="ghost" onclick="toggleStatus()" id="statusBtn"></button></p>
    </div>

    <div class="card">
      <h2>Order queue <span class="muted">(auto-refreshes)</span></h2>
      <ul id="queue"><li class="muted">-</li></ul>
    </div>

    <div class="card">
      <h2>Menu</h2>
      <ul id="menu"></ul>
      <input id="itemId" placeholder="item id (e.g. cr)"><input id="itemName" placeholder="name">
      <input id="itemPrice" placeholder="price in cents" type="number"><label><input id="itemAvail" type="checkbox" checked> available</label>
      <button onclick="saveItem()">Save item</button>
    </div>

    <div class="card">
      <h2>Analytics (last 7 days)</h2>
      <table id="analytics"><tr><td class="muted">-</td></tr></table>
    </div>
  </section>
</main>
<script>
let token = sessionStorage.getItem("ownerIdToken") || null;
let stalls = [], stall = null;
const $ = (id) => document.getElementById(id);
const money = (c) => "$" + (c / 100).toFixed(2);
const NEXT_ACTIONS = { PLACED: ["accept", "reject"], ACCEPTED: ["preparing"], PREPARING: ["ready"], READY: ["collected"] };

async function login() {
  const res = await fetch(`https://cognito-idp.${CONFIG.REGION}.amazonaws.com/`, {
    method: "POST",
    headers: { "content-type": "application/x-amz-json-1.1", "x-amz-target": "AWSCognitoIdentityProviderService.InitiateAuth" },
    body: JSON.stringify({ AuthFlow: "USER_PASSWORD_AUTH", ClientId: CONFIG.CLIENT_ID,
      AuthParameters: { USERNAME: $("email").value, PASSWORD: $("password").value } }),
  });
  const data = await res.json();
  if (!res.ok || !data.AuthenticationResult) { $("loginError").textContent = data.message || "sign-in failed"; return; }
  token = data.AuthenticationResult.IdToken;
  sessionStorage.setItem("ownerIdToken", token);
  boot();
}

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json", authorization: token, ...(opts.headers || {}) };
  const res = await fetch(CONFIG.API_URL + path, { ...opts, headers });
  if (res.status === 401) { sessionStorage.removeItem("ownerIdToken"); location.reload(); }
  return { status: res.status, body: await res.json().catch(() => ({})) };
}

async function boot() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = JSON.parse(atob(token.split(".")[1])).email || "";
  const { body } = await api("/v1/me/stalls");
  stalls = body.stalls || [];
  $("stallSelect").innerHTML = stalls.map((s) => `<option value="${s.stallId}">${s.name}</option>`).join("");
  if (stalls.length) selectStall();
  setInterval(() => stall && loadQueue(), 5000);
}

function selectStall() {
  stall = stalls.find((s) => s.stallId === $("stallSelect").value) || stalls[0];
  $("statusBtn").textContent = stall.status === "OPEN" ? "Set CLOSED" : "Set OPEN";
  loadQueue(); loadMenu(); loadAnalytics();
}

async function createStall() {
  const { status, body } = await api("/v1/stalls", { method: "POST",
    body: JSON.stringify({ name: $("newName").value, centreId: $("newCentre").value }) });
  if (status === 201) boot(); else alert(body.error || "failed");
}

async function toggleStatus() {
  const next = stall.status === "OPEN" ? "CLOSED" : "OPEN";
  const { body } = await api(`/v1/stalls/${stall.stallId}`, { method: "PATCH", body: JSON.stringify({ status: next }) });
  stall.status = body.status; $("statusBtn").textContent = stall.status === "OPEN" ? "Set CLOSED" : "Set OPEN";
}

async function loadQueue() {
  const { body } = await api(`/v1/stalls/${stall.stallId}/orders`);
  const active = (body.orders || []).filter((o) => NEXT_ACTIONS[o.status]);
  $("queue").innerHTML = active.map((o) =>
    `<li class="row"><span>${o.lines.map((l) => l.qty + "x " + l.name).join(", ")}<br>
     <span class="muted">${money(o.totalCents)} - ${o.createdAt}</span></span>
     <span><span class="badge">${o.status}</span>
     ${NEXT_ACTIONS[o.status].map((a) => `<button onclick="act('${o.orderId}','${a}')">${a}</button>`).join(" ")}</span></li>`).join("")
    || '<li class="muted">No active orders.</li>';
}

async function act(orderId, action) {
  const { status, body } = await api(`/v1/orders/${orderId}`, { method: "PATCH", body: JSON.stringify({ action }) });
  if (status !== 200) alert(body.error || "failed");
  loadQueue();
}

async function loadMenu() {
  const { body } = await api(`/v1/stalls/${stall.stallId}/menu`);
  $("menu").innerHTML = (body.items || []).map((i) =>
    `<li class="row"><span>${i.name} <span class="muted">${money(i.priceCents)} - ${i.available ? "available" : "sold out"}</span></span>
     <button class="ghost" onclick="fillItem('${i.itemId}','${i.name.replace(/'/g, "")}',${i.priceCents},${i.available})">Edit</button></li>`).join("")
    || '<li class="muted">No items yet.</li>';
}

function fillItem(id, name, price, avail) { $("itemId").value = id; $("itemName").value = name; $("itemPrice").value = price; $("itemAvail").checked = avail; }

async function saveItem() {
  const { status, body } = await api(`/v1/stalls/${stall.stallId}/menu/${encodeURIComponent($("itemId").value)}`, {
    method: "PUT",
    body: JSON.stringify({ name: $("itemName").value, priceCents: Number($("itemPrice").value), available: $("itemAvail").checked }),
  });
  if (status !== 200) alert(body.error || "failed");
  loadMenu();
}

async function loadAnalytics() {
  const { body } = await api(`/v1/stalls/${stall.stallId}/analytics?days=7`);
  const rows = (body.daily || []).map((d) =>
    `<tr><td>${d.date}</td><td>${d.orders} orders</td><td>${money(d.revenueCents)}</td>
     <td class="muted">${Object.entries(d.items || {}).map(([n, q]) => q + "x " + n).join(", ")}</td></tr>`).join("");
  $("analytics").innerHTML = "<tr><th>Date</th><th>Orders</th><th>Revenue</th><th>Top items</th></tr>" + (rows || "<tr><td class='muted'>No collected orders yet.</td></tr>");
}

if (token) boot();
</script>
</body>
</html>
