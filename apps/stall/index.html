<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HawkerFlow - Stall Portal</title>
<style>
  :root {
    --accent:#1fa956; --accent-ink:#ffffff; --accent-tint:#e9f8ee; --accent-dark:#188341;
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7;
    --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#98989d;
    --hairline:rgba(0,0,0,.08); --danger:#ff3b30; --success:#26a65b; --warning:#b5820a;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px; --radius-pill:999px;
    --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink); }
  header {
    position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center;
    padding:13px 20px; background:rgba(245,245,247,.78); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--hairline);
  }
  .brand { display:flex; align-items:center; gap:9px; font-weight:600; font-size:1.02rem; letter-spacing:-.01em; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  #who { color:var(--ink-2); font-size:.82rem; font-weight:500; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 64px; }

  .card { background:var(--surface); border-radius:var(--radius-lg); padding:20px; margin:14px 0; box-shadow:var(--shadow-card); }
  .card h2 { margin:0; font-size:1.02rem; font-weight:600; letter-spacing:-.01em; }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:12px; flex-wrap:wrap; }
  .muted { color:var(--ink-2); font-size:.85rem; }
  .hidden { display:none !important; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:13px 0; border-bottom:.5px solid var(--hairline); }
  li:last-child { border-bottom:0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }

  button { font-family:inherit; border:0; cursor:pointer; font-size:.88rem; font-weight:600;
    transition:transform .12s ease, opacity .15s ease, background .15s ease; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; transform:none; }
  .btn-primary { background:var(--accent); color:var(--accent-ink); border-radius:var(--radius-pill); padding:9px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .btn-primary:hover:not(:disabled) { background:var(--accent-dark); }
  .btn-danger { background:#fff0ee; color:var(--danger); border-radius:var(--radius-pill); padding:9px 16px; }
  .btn-danger:hover { background:#ffe2de; }
  .btn-ghost { background:var(--surface-2); color:var(--ink); border-radius:var(--radius-pill); padding:8px 14px; font-size:.85rem; }
  .btn-ghost:hover { background:#eceeef; }

  input, select {
    padding:10px 12px; margin:4px 8px 10px 0; font-size:.9rem; font-family:inherit;
    background:var(--surface-2); border:1px solid transparent; border-radius:var(--radius-md); color:var(--ink);
  }
  input:focus, select:focus { outline:none; border-color:var(--accent); background:var(--surface); }
  select { appearance:none; -webkit-appearance:none; padding-right:30px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236e6e73'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%236e6e73' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; }
  label.checkline { display:inline-flex; align-items:center; gap:6px; font-size:.9rem; color:var(--ink-2); margin:4px 8px 10px 0; }
  label.checkline input[type=checkbox] { margin:0; width:auto; }

  .badge { padding:3px 11px; border-radius:var(--radius-pill); font-size:.72rem; font-weight:700;
    letter-spacing:.02em; text-transform:uppercase; background:var(--accent-tint); color:var(--accent-dark); }
  .badge.st-PLACED { background:#eef2ff; color:#3a4bc9; }
  .badge.st-ACCEPTED, .badge.st-PREPARING { background:#fff6df; color:var(--warning); }
  .badge.st-READY { background:var(--accent-tint); color:var(--accent-dark); }

  details { margin:10px 0 4px; }
  details summary { cursor:pointer; color:var(--ink-2); font-size:.85rem; font-weight:500; list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"▸ "; color:var(--ink-3); }
  details[open] summary::before { content:"▾ "; }
  details .panel { padding-top:10px; }

  table { width:100%; border-collapse:collapse; font-size:.87rem; }
  td, th { text-align:left; padding:9px 8px; border-bottom:.5px solid var(--hairline); }
  th { color:var(--ink-2); font-weight:600; font-size:.76rem; text-transform:uppercase; letter-spacing:.03em; }
  tr:last-child td { border-bottom:0; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>HawkerFlow <span class="muted" style="font-weight:500">Stall Portal</span></div>
  <div id="who" class="muted"></div>
</header>
<main>
  <script>
    const CONFIG = {
      API_URL: "REPLACE_WITH_ApiUrl",
      CLIENT_ID: "REPLACE_WITH_UserPoolClientId",
      REGION: "ap-southeast-1",
    };
  </script>

  <section id="login" class="card">
    <h2 style="margin-bottom:12px">Owner sign in</h2>
    <input id="email" type="email" placeholder="Email" value="owner@hawkerflow.demo" style="display:block;width:100%">
    <input id="password" type="password" placeholder="Password" value="HawkerDemo1!" style="display:block;width:100%">
    <button class="btn-primary" onclick="login()" style="width:100%;padding:11px;margin-top:4px">Sign in</button>
    <p id="loginError" class="muted" style="color:var(--danger)"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="card-head"><h2>My stalls</h2><select id="stallSelect" onchange="selectStall()"></select></div>
      <details><summary>Register a new stall</summary>
        <div class="panel">
          <input id="newName" placeholder="Stall name"><input id="newCentre" placeholder="Centre id (e.g. maxwell)">
          <button class="btn-ghost" onclick="createStall()">Create</button>
        </div>
      </details>
      <p style="margin:14px 0 0"><button class="btn-ghost" onclick="toggleStatus()" id="statusBtn"></button></p>
    </div>

    <div class="card">
      <div class="card-head"><h2>Order queue</h2><span class="muted">Auto-refreshes</span></div>
      <ul id="queue"><li class="muted">-</li></ul>
    </div>

    <div class="card">
      <h2 style="margin-bottom:6px">Menu</h2>
      <ul id="menu"></ul>
      <div style="margin-top:12px; padding-top:14px; border-top:.5px solid var(--hairline)">
        <input id="itemId" placeholder="Item id (e.g. cr)"><input id="itemName" placeholder="Name">
        <input id="itemPrice" placeholder="Price in cents" type="number" style="width:150px">
        <label class="checkline"><input id="itemAvail" type="checkbox" checked>Available</label>
        <button class="btn-primary" onclick="saveItem()">Save item</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:10px">Analytics <span class="muted" style="font-weight:400">(last 7 days)</span></h2>
      <table id="analytics"><tr><td class="muted">-</td></tr></table>
    </div>
  </section>
</main>
<script>
let token = sessionStorage.getItem("ownerIdToken") || null;
let stalls = [], stall = null;

// local demo launcher (/demo/) passes ?token=local-owner to skip the login form
{
  const demoToken = new URLSearchParams(location.search).get("token");
  if (demoToken) { token = demoToken; sessionStorage.setItem("ownerIdToken", token); }
}
const $ = (id) => document.getElementById(id);
const money = (c) => "$" + (c / 100).toFixed(2);
const NEXT_ACTIONS = { PLACED: ["accept", "reject"], ACCEPTED: ["preparing"], PREPARING: ["ready"], READY: ["collected"] };

function emailFromToken(t) {
  try { return JSON.parse(atob(t.split(".")[1])).email || ""; } catch { return "local demo"; }
}

async function login() {
  if (CONFIG.CLIENT_ID === "LOCAL") {           // local dev server - no Cognito
    token = "local-owner"; sessionStorage.setItem("ownerIdToken", token); boot(); return;
  }
  const res = await fetch(`https://cognito-idp.${CONFIG.REGION}.amazonaws.com/`, {
    method: "POST",
    headers: { "content-type": "application/x-amz-json-1.1", "x-amz-target": "AWSCognitoIdentityProviderService.InitiateAuth" },
    body: JSON.stringify({ AuthFlow: "USER_PASSWORD_AUTH", ClientId: CONFIG.CLIENT_ID,
      AuthParameters: { USERNAME: $("email").value, PASSWORD: $("password").value } }),
  });
  const data = await res.json();
  if (!res.ok || !data.AuthenticationResult) { $("loginError").textContent = data.message || "sign-in failed"; return; }
  token = data.AuthenticationResult.IdToken;
  sessionStorage.setItem("ownerIdToken", token);
  boot();
}

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json", authorization: token, ...(opts.headers || {}) };
  const res = await fetch(CONFIG.API_URL + path, { ...opts, headers });
  if (res.status === 401) { sessionStorage.removeItem("ownerIdToken"); location.reload(); }
  return { status: res.status, body: await res.json().catch(() => ({})) };
}

async function boot() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = emailFromToken(token);
  const { body } = await api("/v1/me/stalls");
  stalls = body.stalls || [];
  $("stallSelect").innerHTML = stalls.map((s) => `<option value="${s.stallId}">${s.name}</option>`).join("");
  if (stalls.length) selectStall();
  setInterval(() => stall && loadQueue(), 5000);
}

function selectStall() {
  stall = stalls.find((s) => s.stallId === $("stallSelect").value) || stalls[0];
  $("statusBtn").textContent = stall.status === "OPEN" ? "Set closed" : "Set open";
  loadQueue(); loadMenu(); loadAnalytics();
}

async function createStall() {
  const { status, body } = await api("/v1/stalls", { method: "POST",
    body: JSON.stringify({ name: $("newName").value, centreId: $("newCentre").value }) });
  if (status === 201) boot(); else alert(body.error || "failed");
}

async function toggleStatus() {
  const next = stall.status === "OPEN" ? "CLOSED" : "OPEN";
  const { body } = await api(`/v1/stalls/${stall.stallId}`, { method: "PATCH", body: JSON.stringify({ status: next }) });
  stall.status = body.status; $("statusBtn").textContent = stall.status === "OPEN" ? "Set closed" : "Set open";
}

async function loadQueue() {
  const { body } = await api(`/v1/stalls/${stall.stallId}/orders`);
  const active = (body.orders || []).filter((o) => NEXT_ACTIONS[o.status]);
  $("queue").innerHTML = active.map((o) =>
    `<li class="row"><span>${o.lines.map((l) => l.qty + "x " + l.name).join(", ")}<br>
     <span class="muted">${money(o.totalCents)} · ${o.createdAt}</span></span>
     <span class="row" style="gap:8px; width:auto"><span class="badge st-${o.status}">${o.status}</span>
     ${NEXT_ACTIONS[o.status].map((a) => `<button class="${a === "reject" ? "btn-danger" : "btn-primary"}" onclick="act('${o.orderId}','${a}')">${a}</button>`).join(" ")}</span></li>`).join("")
    || '<li class="muted">No active orders.</li>';
}

async function act(orderId, action) {
  const { status, body } = await api(`/v1/orders/${orderId}`, { method: "PATCH", body: JSON.stringify({ action }) });
  if (status !== 200) alert(body.error || "failed");
  loadQueue();
}

async function loadMenu() {
  const { body } = await api(`/v1/stalls/${stall.stallId}/menu`);
  $("menu").innerHTML = (body.items || []).map((i) =>
    `<li class="row"><span>${i.name} <span class="muted">${money(i.priceCents)} · ${i.available ? "available" : "sold out"}</span></span>
     <button class="btn-ghost" onclick="fillItem('${i.itemId}','${i.name.replace(/'/g, "")}',${i.priceCents},${i.available})">Edit</button></li>`).join("")
    || '<li class="muted">No items yet.</li>';
}

function fillItem(id, name, price, avail) { $("itemId").value = id; $("itemName").value = name; $("itemPrice").value = price; $("itemAvail").checked = avail; }

async function saveItem() {
  const { status, body } = await api(`/v1/stalls/${stall.stallId}/menu/${encodeURIComponent($("itemId").value)}`, {
    method: "PUT",
    body: JSON.stringify({ name: $("itemName").value, priceCents: Number($("itemPrice").value), available: $("itemAvail").checked }),
  });
  if (status !== 200) alert(body.error || "failed");
  loadMenu();
}

async function loadAnalytics() {
  const { body } = await api(`/v1/stalls/${stall.stallId}/analytics?days=7`);
  const rows = (body.daily || []).map((d) =>
    `<tr><td>${d.date}</td><td>${d.orders} orders</td><td>${money(d.revenueCents)}</td>
     <td class="muted">${Object.entries(d.items || {}).map(([n, q]) => q + "x " + n).join(", ")}</td></tr>`).join("");
  $("analytics").innerHTML = "<tr><th>Date</th><th>Orders</th><th>Revenue</th><th>Top items</th></tr>" + (rows || "<tr><td class='muted'>No collected orders yet.</td></tr>");
}

if (token) boot();
</script>
</body>
</html>
