[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "services/shared/python",
  "services/merchant/src",
  "services/catalog/src",
  "services/ordering/src",
  "services/dispatcher/src",
  "services/notification/src",
  "services/analytics/src",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".aws-sam", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
