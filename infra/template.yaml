AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HawkerFlow - hawker centre food ordering platform.
  Serverless, pay-per-request stack: CloudFront+S3, Cognito (Lite tier), API Gateway
  (HTTP API), Lambda (Python 3.12, X-Ray), DynamoDB single table + Streams,
  SQS + DLQs, 14-day log retention, CloudWatch alarms, SSM config.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref PlatformTable
        STAGE: !Ref Stage
        NOTIF_QUEUE_URL: !Ref NotificationsQueue
        ANALYTICS_QUEUE_URL: !Ref AnalyticsQueue
        ORDER_TTL_PARAM: !Sub /hawkerflow/${Stage}/order-ttl-days
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ['*']
      AllowHeaders: ['*']
      AllowMethods: ['*']

Resources:

  # ---------------- Data ----------------
  PlatformTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hawkerflow-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: GSI2
          KeySchema:
            - {AttributeName: GSI2PK, KeyType: HASH}
            - {AttributeName: GSI2SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------- Configuration (SSM Parameter Store) ----------------
  OrderTtlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /hawkerflow/${Stage}/order-ttl-days
      Type: String
      Value: '90'
      Description: Online retention of order records in days (read by the ordering service)

  # ---------------- Events ----------------
  NotificationsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-notifications-dlq
      MessageRetentionPeriod: 1209600
  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-notifications
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDLQ.Arn
        maxReceiveCount: 3
  AnalyticsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-analytics-dlq
      MessageRetentionPeriod: 1209600
  AnalyticsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-analytics
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyticsDLQ.Arn
        maxReceiveCount: 3

  OrderIngestionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-orders-dlq
      MessageRetentionPeriod: 1209600
  OrderIngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-orders
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderIngestionDLQ.Arn
        maxReceiveCount: 3

  # ---------------- Identity ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub hawkerflow-${Stage}
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub hawkerflow-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
  StallOwnerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: stall-owner
      UserPoolId: !Ref UserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  # ---------------- API ----------------
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoJwt

  # ---------------- Shared layer ----------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub hawkerflow-${Stage}-shared
      ContentUri: ../services/shared
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  # ---------------- Services ----------------
  # IAM: each function gets only the DynamoDB actions and resources it uses
  # (no Scan or DeleteItem anywhere; dispatcher has no table access at all).
  MerchantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-merchant
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref MerchantErrorsAlarm
      CodeUri: ../services/merchant/src
      Handler: merchant_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt PlatformTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt PlatformTable.Arn
                - !Sub ${PlatformTable.Arn}/index/GSI2
      Events:
        CreateStall:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/stalls
        MyStalls:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/me/stalls
        UpdateStall:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/stalls/{stallId}

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-catalog
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref CatalogErrorsAlarm
      CodeUri: ../services/catalog/src
      Handler: catalog_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt PlatformTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt PlatformTable.Arn
                - !Sub ${PlatformTable.Arn}/index/GSI1
      Events:
        ListStalls:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/centres/{centreId}/stalls
            Auth: {Authorizer: NONE}
        GetStall:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}
            Auth: {Authorizer: NONE}
        GetMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}/menu
            Auth: {Authorizer: NONE}
        PutMenuItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /v1/stalls/{stallId}/menu/{itemId}

  OrderIntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-order-intake
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref OrderIntakeErrorsAlarm
      CodeUri: ../services/order_intake/src
      Handler: order_intake_service.handler.lambda_handler
      Environment:
        Variables:
          ORDER_INGESTION_QUEUE_URL: !Ref OrderIngestionQueue
          CANARY_TEST_MARKER: "2026-09-12-order-intake"
      Policies:
        - SQSSendMessagePolicy: {QueueName: !GetAtt OrderIngestionQueue.QueueName}
      Events:
        SubmitOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/orders

  OrderingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-ordering
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref OrderingErrorsAlarm
      CodeUri: ../services/ordering/src
      Handler: ordering_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt PlatformTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt PlatformTable.Arn
                - !Sub ${PlatformTable.Arn}/index/GSI1
                - !Sub ${PlatformTable.Arn}/index/GSI2
        - SSMParameterReadPolicy:
            ParameterName: !Sub hawkerflow/${Stage}/order-ttl-days
      Events:
        OrderMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderIngestionQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 25
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/orders/{orderId}
        MyOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/me/orders
        StallQueue:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}/orders
        Transition:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/orders/{orderId}

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-dispatcher
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref DispatcherErrorsAlarm
      CodeUri: ../services/dispatcher/src
      Handler: dispatcher_service.handler.lambda_handler
      Policies:
        - SQSSendMessagePolicy: {QueueName: !GetAtt NotificationsQueue.QueueName}
        - SQSSendMessagePolicy: {QueueName: !GetAtt AnalyticsQueue.QueueName}
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PlatformTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumBatchingWindowInSeconds: 1

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-notification
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref NotificationErrorsAlarm
      CodeUri: ../services/notification/src
      Handler: notification_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt PlatformTable.Arn
        - SQSPollerPolicy: {QueueName: !GetAtt NotificationsQueue.QueueName}
      Events:
        Messages:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationsQueue.Arn
            BatchSize: 10
        MyNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/me/notifications

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-analytics
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref AnalyticsErrorsAlarm
      CodeUri: ../services/analytics/src
      Handler: analytics_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt PlatformTable.Arn
        - SQSPollerPolicy: {QueueName: !GetAtt AnalyticsQueue.QueueName}
      Events:
        Messages:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalyticsQueue.Arn
            BatchSize: 10
        StallAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}/analytics

  # ---------------- Observability: 14-day log retention ----------------
  MerchantLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-merchant
      RetentionInDays: 14
  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-catalog
      RetentionInDays: 14
  OrderingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-ordering
      RetentionInDays: 14
  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-dispatcher
      RetentionInDays: 14
  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-notification
      RetentionInDays: 14
  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-analytics
      RetentionInDays: 14

  # ---------------- Observability: alarms (11 per stage) ----------------
  MerchantErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-merchant-errors
      AlarmDescription: Errors in the merchant service canary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref MerchantFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CatalogErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-catalog-errors
      AlarmDescription: Errors in the catalog service canary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref CatalogFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OrderIntakeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-order-intake-errors
      AlarmDescription: Errors in the order intake canary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OrderIntakeFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-api-5xx
      AlarmDescription: Server errors at the API front door
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - {Name: ApiId, Value: !Ref Api}
        - {Name: Stage, Value: !Ref Stage}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-notifications-dlq
      AlarmDescription: Poison messages parked in the notifications DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt NotificationsDLQ.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AnalyticsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-analytics-dlq
      AlarmDescription: Poison messages parked in the analytics DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt AnalyticsDLQ.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OrderingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-ordering-errors
      AlarmDescription: Unhandled errors in the ordering service
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OrderingFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-dispatcher-errors
      AlarmDescription: Outbox dispatcher failing - events not flowing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref DispatcherFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-notification-errors
      AlarmDescription: Errors in the notification service canary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref NotificationFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AnalyticsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-analytics-errors
      AlarmDescription: Errors in the analytics service canary
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref AnalyticsFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OrderIngestionDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-orders-dlq
      AlarmDescription: Orders that could not be processed after retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt OrderIngestionDLQ.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------- Web hosting ----------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hawkerflow-${Stage}-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub hawkerflow-${Stage}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub HawkerFlow ${Stage} web apps
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: web-bucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: web-bucket
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref PlatformTable
  WebBucketName:
    Value: !Ref WebBucket
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
