openapi: 3.0.3
info:
  title: HawkerFlow Platform API
  version: "1.0"
  description: >
    Versioned platform APIs consumed by the diner app, the stall portal, and
    future seeds/partners. Auth: Cognito JWT in the Authorization header,
    except the public catalog reads.
servers:
  - url: https://{apiId}.execute-api.ap-southeast-1.amazonaws.com/{stage}
paths:
  /v1/centres/{centreId}/stalls:
    get: {summary: List stalls in a centre (public), responses: {"200": {description: OK}}}
  /v1/stalls/{stallId}:
    get: {summary: Stall profile (public), responses: {"200": {description: OK}}}
    patch: {summary: Set stall OPEN/CLOSED (owner), responses: {"200": {description: OK}}}
  /v1/stalls/{stallId}/menu:
    get: {summary: Menu for a stall (public), responses: {"200": {description: OK}}}
  /v1/stalls/{stallId}/menu/{itemId}:
    put: {summary: Create/update a menu item (owner), responses: {"200": {description: OK}}}
  /v1/stalls:
    post: {summary: Register a stall (producer onboarding), responses: {"201": {description: Created}}}
  /v1/me/stalls:
    get: {summary: Stalls owned by the caller, responses: {"200": {description: OK}}}
  /v1/orders:
    post:
      summary: Queue an order (idempotent via Idempotency-Key header)
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        "202": {description: Accepted for asynchronous processing}
        "200": {description: Message accepted by the ingestion queue}
  /v1/orders/{orderId}:
    get: {summary: Get an order (diner or stall owner), responses: {"200": {description: OK}}}
    patch:
      summary: "Transition an order. Body: {action: accept|reject|preparing|ready|collected|cancel}"
      responses:
        "200": {description: OK}
        "409": {description: Illegal transition or stale expected status}
  /v1/me/orders:
    get: {summary: Caller's order history, responses: {"200": {description: OK}}}
  /v1/stalls/{stallId}/orders:
    get: {summary: Stall order queue, optional ?status= filter (owner), responses: {"200": {description: OK}}}
  /v1/me/notifications:
    get: {summary: Caller's recent notifications, responses: {"200": {description: OK}}}
  /v1/stalls/{stallId}/analytics:
    get: {summary: Daily aggregates, optional ?days=N (owner), responses: {"200": {description: OK}}}
