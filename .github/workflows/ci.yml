name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit and repository tests (pytest + moto)
        run: pytest -q
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements-dev.txt

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan repository for secrets
        run: gitleaks detect --source . -v --redact

  sam-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate template (offline lint)
        run: sam validate -t infra/template.yaml --lint --region ap-southeast-1
      - name: Prove the app builds
        run: sam build -t infra/template.yaml
